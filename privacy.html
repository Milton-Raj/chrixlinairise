<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy — Chrixlin AI Rise</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="description" content="Privacy Policy for Chrixlin AI Rise — how we collect, use, and protect your personal information." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-client.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f0f1a;
      --bg2:     #14141f;
      --border:  rgba(255,255,255,0.08);
      --text:    #f1f5f9;
      --sub:     #94a3b8;
      --muted:   #64748b;
      --primary: #7c3aed;
      --font:    'Inter', sans-serif;
      --font-h:  'Syne', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.7; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,15,26,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-family: var(--font-h); font-size: 20px; font-weight: 800; color: var(--text); text-decoration: none; }
    .nav-logo span { color: var(--primary); }
    .nav-back { font-size: 14px; color: var(--sub); padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; transition: all 0.2s; }
    .nav-back:hover { color: var(--text); border-color: var(--primary); text-decoration: none; }

    /* PAGE */
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 60px 24px 100px; }
    .page-header { margin-bottom: 48px; padding-bottom: 32px; border-bottom: 1px solid var(--border); }
    .page-header h1 { font-family: var(--font-h); font-size: clamp(28px,5vw,44px); font-weight: 800; margin-bottom: 12px; }
    .page-header .meta { font-size: 13px; color: var(--muted); }

    /* CONTENT STYLES */
    #privacyContent h2 {
      font-family: var(--font-h); font-size: 20px; font-weight: 700;
      color: var(--text); margin: 40px 0 14px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    #privacyContent h3 { font-size: 16px; font-weight: 600; color: var(--text); margin: 24px 0 10px; }
    #privacyContent p { color: var(--sub); margin-bottom: 14px; font-size: 15px; }
    #privacyContent ul, #privacyContent ol { color: var(--sub); margin: 0 0 16px 20px; font-size: 15px; }
    #privacyContent li { margin-bottom: 8px; }
    #privacyContent strong { color: var(--text); }
    #privacyContent a { color: var(--primary); }

    /* FOOTER */
    footer { background: var(--bg2); border-top: 1px solid var(--border); padding: 28px 24px; text-align: center; }
    footer p { font-size: 13px; color: var(--muted); }
    footer a { color: var(--sub); margin: 0 10px; }
    footer a:hover { color: var(--text); }

    @media (max-width: 600px) {
      .page-wrap { padding: 36px 16px 80px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Chrixlin <span>AI Rise</span></a>
  <a href="index.html" class="nav-back">← Back to Home</a>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <h1>Privacy Policy</h1>
    <div class="meta" id="privacyLastUpdated">Last updated: January 2025</div>
  </div>
  <div id="privacyContent">
    <!-- Content loaded from Supabase or default below -->
  </div>
</div>

<footer>
  <p>
    <a href="index.html">Home</a>
    <a href="terms.html">Terms &amp; Conditions</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="mailto:info@chrixlin.tech">Contact</a>
  </p>
  <p style="margin-top:10px">© 2025 Chrixlin AI Rise. All rights reserved.</p>
</footer>

<script>
// ── DEFAULT PRIVACY POLICY CONTENT ────────────────────────────────────────────
var DEFAULT_PRIVACY = `
<h2>1. Introduction</h2>
<p>Welcome to Chrixlin AI Rise ("Company", "we", "us", or "our"). We are committed to protecting your personal information and your right to privacy. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you visit our website <a href="https://chrixlin.tech">chrixlin.tech</a>.</p>
<p>This website does not have user accounts, logins, or a payment/checkout system — it is used to showcase our work and let visitors book a free strategy call. Please read this policy carefully. If you disagree with its terms, please discontinue use of our site.</p>

<h2>2. Information We Collect</h2>
<p>We collect information you voluntarily provide to us when you:</p>
<ul>
  <li>Book a free strategy call through our booking form</li>
  <li>Contact us via email</li>
</ul>
<h3>Personal Information</h3>
<p>This is typically limited to your <strong>name, email address, and phone number</strong>, and any message or details you choose to include.</p>
<h3>Automatically Collected Information</h3>
<p>When you visit our website, we may automatically collect certain technical information, such as your IP address, browser type, device type, referring URLs, and pages viewed. If enabled, this is collected via analytics tools such as <strong>Google Analytics</strong> and/or <strong>Meta Pixel</strong>, used to understand traffic and improve the site.</p>

<h2>3. How We Use Your Information</h2>
<p>We use the information we collect to:</p>
<ul>
  <li><strong>Respond to your enquiry</strong> — follow up on a booked strategy call or message</li>
  <li><strong>Improve our website</strong> — understand traffic patterns and how visitors use the site</li>
  <li><strong>Send occasional follow-up communication</strong> — only relevant to your enquiry; you may opt out at any time by replying or emailing us</li>
  <li><strong>Comply with legal obligations</strong> — where required by applicable law</li>
</ul>

<h2>4. Sharing Your Information</h2>
<p>We do <strong>not sell</strong> your personal information to third parties. We may share your data only in the following circumstances:</p>
<ul>
  <li><strong>Service providers</strong> — trusted partners who help us operate this website, such as Supabase (data storage), our calendar/scheduling provider, and email delivery tools. These parties only receive what's needed to provide their service.</li>
  <li><strong>Legal requirements</strong> — if required by law, court order, or governmental authority</li>
  <li><strong>With your consent</strong> — for any other purpose with your explicit permission</li>
</ul>

<h2>5. Cookies & Tracking</h2>
<p>Our website does not use login sessions or checkout cookies, since there are no accounts or purchases. If analytics tools (such as Google Analytics or Meta Pixel) are enabled, they may set cookies or similar technologies to help us understand website traffic and ad performance. You can control cookie settings through your browser.</p>

<h2>6. Data Retention</h2>
<p>We retain enquiry and booking information for as long as necessary to respond to you and maintain reasonable business records, after which it is deleted or anonymised on request.</p>

<h2>7. Data Security</h2>
<p>We implement reasonable security measures to protect your personal information, including:</p>
<ul>
  <li><strong>SSL/TLS encryption</strong> on all data transmitted to and from our website</li>
  <li><strong>Secure database hosting</strong> via Supabase with row-level security policies</li>
</ul>
<p>While we take reasonable precautions, no method of electronic transmission or storage is 100% secure. We cannot guarantee absolute security of your data.</p>

<h2>8. Your Rights</h2>
<p>Depending on your location, you may have the following rights regarding your personal data:</p>
<ul>
  <li><strong>Access</strong> — request a copy of the personal data we hold about you</li>
  <li><strong>Correction</strong> — request correction of inaccurate or incomplete data</li>
  <li><strong>Deletion</strong> — request deletion of your personal data ("right to be forgotten")</li>
  <li><strong>Objection</strong> — object to processing of your data for marketing purposes</li>
  <li><strong>Withdrawal of consent</strong> — withdraw consent at any time where processing is based on consent</li>
</ul>
<p>To exercise any of these rights, please contact us at <a href="mailto:info@chrixlin.tech">info@chrixlin.tech</a>. We will respond within 30 days.</p>

<h2>9. Third-Party Links</h2>
<p>Our website may contain links to third-party websites (e.g. our calendar/scheduling provider, YouTube). This Privacy Policy does not apply to those sites. We encourage you to review the privacy policies of any third-party services you visit.</p>

<h2>10. Children's Privacy</h2>
<p>Our services are not directed to individuals under the age of 18. We do not knowingly collect personal information from children. If you believe a child has provided us with personal information, please contact us immediately and we will delete it.</p>

<h2>11. International Transfers</h2>
<p>Your information may be stored and processed in countries outside your own. We ensure appropriate safeguards are in place for any international transfers, consistent with applicable data protection laws.</p>

<h2>12. Changes to This Policy</h2>
<p>We may update this Privacy Policy from time to time to reflect changes in our practices or legal requirements. When we do, we will revise the "Last updated" date at the top of this page.</p>

<h2>13. Contact Us</h2>
<p>If you have any questions, concerns, or requests regarding this Privacy Policy or our data practices, please contact us:</p>
<ul>
  <li><strong>Email:</strong> <a href="mailto:info@chrixlin.tech">info@chrixlin.tech</a></li>
  <li><strong>Website:</strong> <a href="https://chrixlin.tech">chrixlin.tech</a></li>
</ul>
`;

// ── LOAD CONTENT (Supabase → fallback to default) ─────────────────────────
(async function loadPrivacy() {
  var content = null;
  try {
    if (typeof ChrixlinDB !== 'undefined') {
      content = await ChrixlinDB.loadFromSupabase('site_settings', 'privacy_policy');
    }
  } catch(e) {}
  var el = document.getElementById('privacyContent');
  if (content && content.html) {
    el.innerHTML = content.html;
    if (content.updatedAt) {
      document.getElementById('privacyLastUpdated').textContent =
        'Last updated: ' + new Date(content.updatedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }
  } else {
    el.innerHTML = DEFAULT_PRIVACY;
  }
})();
</script>

</body>
</html>
